// CS2 Weapon Skins - Configuration
// Place this file at: <game_root>/cfg/cs2ws/core.cfg

"cs2weaponskins"
{
    "General"
    {
        // Chat prefix prepended to all plugin messages.
        // Color tags: {default} {darkred} {purple} {green} {olive} {lime} {red}
        //             {grey} {yellow} {bluegrey} {blue} {darkblue} {orchid} {lightred} {gold}
        "ChatPrefix"            "{orchid}FKZ {grey}| "

        // Chat command prefix, the message stays visible
        "CommandPrefix"         "!"

        // Silent chat command prefix, the message is hidden
        "SilentCommandPrefix"   "/"

        // When a client's language, or a phrase's entry for it, is missing.
        "DefaultLanguage"       "en"

        // Mirror plugin log output to addons/cs2weaponskins/logs/.
        "LogToFile"             "1"
        // Delete log files older than this many days (0 = keep all).
        "LogRetentionDays"      "30"

        // Menu rendering style. The menus come from the mm-cs2menus plugin, which is required.
        //   "default"  - let mm-cs2menus' own config decide
        //   "chat"     - force chat menus
        //   "html"     - force center-screen html menus
        //   "panorama" - force the panorama menu window (needs the cs2menus workshop addon)
        "MenuType"              "default"

        // HTML menu navigation key overrides.
        //   "default" - use the key mm-cs2menus is configured with
        //   "none"    - disable this action (e.g. NavUp "none" = single-key scroll)
        //   otherwise a key name: w s a d, e/use, shift/speed, ctrl/duck,
        //              space/jump, r/reload, mouse1, mouse2, tab, f/inspect
        "MenuNavUp"             "default"  // move cursor up
        "MenuNavDown"           "default"  // move cursor down
        "MenuNavSelect"         "default"  // select highlighted item
        "MenuNavBack"           "default"  // close / exit
    }

    // Which team a menu pick is worn on. Loadouts are always stored per team, so switching later keeps everyone's picks.
    //   "shared" - one pick, worn on both teams
    //   "choice" - the player picks Both, T or CT before each change
    //   "team"   - separate T and CT loadouts. For agents also only the team's own models, like stock CS.
    "Teams"
    {
        "Skins"                 "shared"  // guns, knives, gloves, music kits and pins
        "Agents"                "shared"    // a CT model on a T confuses players, unlike a skin
    }

    "StatTrak"
    {
        // "realistic" - the counter only goes up with the player's kills with that weapon, and starts over with a new paint
        // "free"      - players can also set the counter to anything in the skin editor
        "Mode"                  "free"

        // "separate" - each knife has its own counter, like in the game
        // "shared"   - a knife shows the kills of all the player's knives on that team, each still counting its own
        "Knives"                "shared"

        // StatTrak music kits count the player's MVPs
        // "separate" - each kit has its own counter, like in the game
        // "shared"   - a kit shows the MVPs of all the player's kits on that team, each still counting its own
        "MusicKits"             "shared"
    }

    "Bots"
    {
        // A player taking over a bot, in modes with bots
        // "bot"    - the bot keeps its own items, like in stock CS
        // "player" - the player's skins, knife, gloves and agent go on the bot
        "Takeover"              "bot"
    }

    // The 3D preview beside the skin editor and the pickers, in panorama menus.
    "Preview"
    {
        // While an item floats in front of a player, the player is frozen and
        // "hidden"  - not drawn for anyone, weapons included, so the item is all its owner sees. They can still be shot.
        // "visible" - drawn as usual, holding their weapons, which they can switch and drop but not fire.
        //             Their own model then stands in their view too, behind the item.
        "Player"                "hidden"
    }

    "Equipment"
    {
        // The C4 has no skins, but takes stickers, a charm and a name tag
        // "on"  - it's in !ws and the loadout like a gun
        // "off" - the plugin leaves it alone: not listed, and picks saved for it aren't worn
        "C4"                    "on"
    }

    // !import, wearing a skin from an inspect link or code.
    "Import"
    {
        // "loadout" - saves it, a gun the player carries is swapped for the skinned one
        // "give"    - also gives the gun when the player doesn't have it, only to players allowed !guns
        "Mode"                  "give"
    }

    // Saved loadouts in !ws: whole sets of picks for both teams, switched in one click.
    "Loadouts"
    {
        "Max"                   "5"       // per player, the one worn included, up to 9. 1 turns them off
    }

    // Saved looks in the skin editor: whole skin setups kept per gun, knife or pair of gloves, to load back later.
    "Looks"
    {
        "Max"                   "10"       // per player and item, up to 16. 0 turns them off
    }

    // !graffiti and !spray, any graffiti in any tint without owning it.
    // The game keeps sprays until the map changes, these limit how many pile up.
    "Graffiti"
    {
        "Cap"                   "1"       // sprays kept per player, spraying again removes their oldest
        "Cooldown"              "30"      // seconds between a player's sprays
    }

    // Names for guns in item= and what=, besides the class name (deagle, m4a1_silencer) and the in-game name (Desert Eagle, M4A1-S).
    // Spaces, dashes and case don't matter when players type them. Left side the alias, right side the class name without weapon_.
    // This block replaces the built-in list, so keep the ones you want. Note m4a1 is the class name of the M4A4.
    "GunAliases"
    {
        "usp"                   "usp_silencer"
        "usps"                  "usp_silencer"
        "r8"                    "revolver"
        "cz"                    "cz75a"
        "cz75"                  "cz75a"
        "zeus"                  "taser"
        "dualies"               "elite"
        "berettas"              "elite"
        "p2k"                   "hkp2000"
        "p2000"                 "hkp2000"
        "galil"                 "galilar"
        "scout"                 "ssg08"
        "deag"                  "deagle"
        "de"                    "deagle"
        "dualelites"            "elite"
        "five7"                 "fiveseven"
        "5seven"                "fiveseven"
        "57"                    "fiveseven"
        "m4a1"                  "m4a1_silencer"
        "m4a4"                  "m4a1"
    }

    // Admin flag needed for each menu (mm-cs2admin flag names, e.g. "custom1", "reservation").
    // Blank = everyone. Without mm-cs2admin, any flag here locks the menu to the server console.
    "Permissions"
    {
        "Weapons"               ""        // !ws
        "Knives"                ""        // !knife
        "Gloves"                ""        // !gloves
        "Agents"                ""        // !agent
        "Music"                 ""        // !music
        "Pins"                  ""        // !pins
        "Pets"                  ""        // !pet, a chicken that follows the player
        "Guns"                  ""        // !guns, gives the player any gun
        "Admin"                 "config"  // !wsreload and !wsdebug
        "ExportPlayers"         ""        // !export player=, another player's items, offline ones by SteamID
        "ResetPlayers"          "root"    // !wsreset player=, clears another player's picks, offline ones by SteamID
        "Graffiti"              ""        // !graffiti and !spray
        "ClearSprays"           "generic" // !clearsprays, everyone's sprays or another player's
    }

    // Skin storage. Requires the sql_mm Metamod plugin.
    // Without it, picks last until the player disconnects.
    "Database"
    {
        // "sqlite" or "mysql"
        "Type"      "mysql"

        // SQLite: path to the .db file, relative to the game dir (game/csgo/)
        "Path"      "addons/cs2weaponskins/cs2weaponskins.db"

        // Table name prefix, like ws_skins
        "Prefix"    "ws"

        // MySQL settings (only used when Type is "mysql")
        "Host"      ""
        "User"      ""
        "Pass"      ""
        "Database"  "s"
        "Port"      ""

        // Delete the saved picks of players not on for this many days, checked on each map change. 0 keeps them forever.
        "InactiveDays"  "90"
    }
}
