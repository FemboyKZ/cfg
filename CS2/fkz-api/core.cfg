// FKZ API Plugin (Metamod:Source) - Configuration
// Packaged to: <game>/cfg/fkz-api/core.cfg

"fkz-api"
{
    "Config"
    {
        // API base URL (HTTP or HTTPS), e.g. https://api.femboykz.com
        // Just scheme://host[:port] - no trailing path. A trailing slash is trimmed.
        "ApiUrl"                "https://api.femboykz.com"

        // API authentication key (sent as Authorization: Bearer header).
        // Must match ADMIN_API_KEY in the API's .env.
        // Required for status reporting and for any endpoints behind admin auth.
        "ApiKey"                ""

        // Server IP override (RECOMMENDED).
        // The hostip ConVar often resolves to 0.0.0.0, which the API rejects.
        // Set this to the server's public IP, matching the IP registered in the API.
        "ServerIp"              ""

        // Server port override (optional, uses the hostport ConVar if unset/0).
        "ServerPort"            ""

        // Reporting interval in seconds (minimum 1, default 10).
        "Interval"              "10"

        // Chat command prefixes. Each character is an accepted prefix.
        // Normal: the message stays visible in chat.
        "CommandPrefix"         "!"
        // Silent: the message is suppressed (not shown in chat).
        "SilentCommandPrefix"   "/"

        // Mirror plugin log output to addons/fkz-api/logs/.
        "LogToFile"             "1"
        // Delete log files older than this many days (0 = keep all).
        "LogRetentionDays"      "30"
    }

    // Local database, for the cross-chat toggle each player saved.
    // Requires the sql_mm Metamod plugin to be loaded.
    "Database"
    {
        // Set to "1" to enable.
        "Enabled"   "1"

        // "sqlite" or "mysql"
        "Type"      "mysql"

        // SQLite: path to the database file (relative to game root, dirs auto-created)
        "Path"      "addons/fkz-api/data/prefs.sqlite3"

        // In front of the table names, for a schema shared with other plugins. Letters, digits and underscore.
        // Changing it starts over with empty tables.
        "Prefix"    ""

        // MySQL settings (only used when Type is "mysql")
        "Host"      ""
        "User"      ""
        "Pass"      ""
        "Database"  ""
        "Port"      ""
    }
}
