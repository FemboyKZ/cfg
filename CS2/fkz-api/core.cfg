// FKZ-API Plugin - Configuration
// Place this file at: addons/sourcemod/configs/fkz-api.cfg

// API base URL (supports HTTP and HTTPS), e.g. https://api.femboykz.com
// Do NOT include a path - just scheme://host[:port].
api_url "https://api.femboykz.com"

// API key for authentication (optional, sent as Bearer token)
"api_key"       ""

// Server IP override (leave empty to auto-detect from hostip)
"server_ip"     ""

// Server port override (leave empty or 0 to auto-detect from hostport)
"server_port"   ""

// Reporting interval in seconds (minimum 1, default 10)
"interval"      "10"

// Local database
// Requires the sql_mm plugin to be loaded. Leave db_driver empty to disable.

// Driver: "sqlite", "mysql", or empty to disable.
db_driver   "mysql"

// sqlite: database file path relative to the game dir (dirs auto-created).
// mysql:  schema (database) name.
db_database ""

// MySQL connection (ignored when db_driver is "sqlite").
db_host     ""
db_user     ""
db_pass     ""
db_port     ""
